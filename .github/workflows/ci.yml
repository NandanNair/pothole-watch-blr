name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run tests
        run: pytest -v

  compose:
    name: Docker Compose boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait
      - name: Call the health endpoint
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
